name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Restore packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run Core tests
        run: >
          dotnet test
          tests/ApiSqlSync.Core.Tests/ApiSqlSync.Core.Tests.csproj
          --configuration Release
          --no-build
          --no-restore

      - name: Run PostgREST tests
        run: >
          dotnet test
          tests/ApiSqlSync.PostgRest.Tests/ApiSqlSync.PostgRest.Tests.csproj
          --configuration Release
          --no-build
          --no-restore